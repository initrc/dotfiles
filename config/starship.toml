add_newline = false
format = "$directory${custom.git_clean}${custom.git_dirty}${custom.no_git}"

[directory]
style = "fg:black bg:blue"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false

[custom.git_clean]
command = "git symbolic-ref --short HEAD"
when = 'test -z "$(git status --porcelain)"'
require_repo = true
format = "[](fg:blue bg:green)[  $output ](fg:black bg:green)[](green) "

[custom.git_dirty]
command = "git symbolic-ref --short HEAD"
when = 'test -n "$(git status --porcelain)"'
require_repo = true
format = "[](fg:blue bg:purple)[  $output ](fg:black bg:purple)[](purple) "

[custom.no_git]
when = 'test -z "$(git rev-parse --is-inside-work-tree 2>/dev/null)"'
format = "[](blue) "

[character]
disabled = true

[cmd_duration]
disabled = true

[git_branch]
disabled = true

[git_status]
disabled = true

[line_break]
disabled = true
