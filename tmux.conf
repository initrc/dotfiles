# prefix
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# basic
set -g allow-passthrough all # notifications
set -g focus-events on # let NeoVim detect a timestamp change so autoread triggers a reload
set -g mouse on
set -g mode-keys vi # prefix-[ triggers copy mode with vi nav bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi V send -X select-line

# pane
set -g base-index 1
set -g pane-base-index 1 # prefix-q triggers the pane label
set -g pane-active-border-style 'fg=#303446' # hide the active border by matching the background
set -g pane-border-style 'fg=#303446' # hide the inactive border by matching the background

set -g pane-border-format \
  '#[align=centre]#{?pane_zoomed_flag,#[fg=white]◆◆,#{?pane_active,#[fg=white]◆,}}'
set -g pane-border-status off # help visualize the active pane, off initially with 1 pane
set-hook -g after-split-window 'set -w pane-border-status top' # show when pane split
set-hook -g after-kill-pane \
  'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off" "select-layout even-horizontal"'
set-hook -g pane-exited \
  'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off" "select-layout even-horizontal"'

bind d splitw -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind D splitw -v -c "#{pane_current_path}" \; select-layout even-vertical
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind x kill-pane

# status bar
set -g status-justify absolute-centre
set -g status-style 'fg=colour8,bg=default'
set -g status-left ''
set -g status-right ''
# set -g status-right '%-m/%-d %H:%M ' # date & time
set -g window-status-current-style 'fg=white,bg=default,bold'
# only show the window name if it's manually set and non-empty 
set -g window-status-format '#I#{?automatic-rename,,#{?#{n:window_name},:#W}}'
set -g window-status-current-format '#I#{?automatic-rename,,#{?#{n:window_name},:#W}}'

# fix shift-enter in codex
set-option -g extended-keys on
set-option -g extended-keys-format csi-u

